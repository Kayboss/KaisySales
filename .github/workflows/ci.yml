name: Security CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The authorization suite queries the live database rather than this repository,
  # so a policy changed outside git (in the Supabase dashboard, or by hand) would
  # otherwise go unnoticed until the next push. Nightly catches that.
  # 03:17 rather than 03:00: on-the-hour schedules are heavily oversubscribed.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  # The event is part of the group so a push does not cancel the nightly run, and
  # the nightly run does not cancel a push's run. Both use refs/heads/master.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, audit, secrets, build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so the advisory git-history secret scan can see every commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (fail-closed backend rules)
        run: npm test

      - name: Dependency audit (production deps must be free of high+)
        run: npm run audit

      - name: Secret scan (working tree fails, history is advisory)
        run: npm run secrets:history

      - name: Build
        run: npm run build

      - name: Production bundle must not contain privileged secrets
        run: npm run scan:dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  zap:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Serve the built app
        run: |
          npx --yes vite preview --port 4173 --host 0.0.0.0 &
          npx --yes wait-on http://127.0.0.1:4173 --timeout 90000

      - name: Confirm the app is actually being served
        run: |
          curl -sf http://127.0.0.1:4173 -o /dev/null && echo "preview server is up"
          asset=$(curl -s http://127.0.0.1:4173 | grep -o '/assets/index-[^"]*\.js' | head -1)
          echo "entry bundle: ${asset:-none found}"
          curl -sf "http://127.0.0.1:4173${asset}" -o /dev/null && echo "entry bundle is served as JS"

      # Pull in its own step so a registry failure is attributed to the pull
      # rather than looking like a scanning failure.
      - name: Pull the scanner
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      # WARN-level findings are informational only (the preview server does not
      # apply the vercel.json headers), so only ERROR-level alerts fail the job.
      #
      # The container's exit code mixes security findings with harness errors, so
      # it is not used as the verdict. The report is the evidence: no report means
      # the scan did not run, which is a failure, not a pass.
      - name: ZAP baseline scan
        run: |
          set +e
          # The image runs as its own uid, so the workspace has to be writable for
          # it to drop the report in the mounted volume.
          chmod -R a+rwX . || true
          # Deliberately NOT --network=host: that makes ZAP bind its own API port
          # on the runner's network, which killed the daemon ("Failed to start ZAP")
          # before it ever scanned anything. host.docker.internal reaches the
          # preview server across the default bridge instead, and --shm-size gives
          # the scanner more than its default 64MB of shared memory.
          docker run --rm --shm-size=2g --add-host=host.docker.internal:host-gateway \
            -v "$PWD:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://host.docker.internal:4173 -J zap-report.json -l WARN -I -m 5 2>&1 | tee zap-scan.log
          echo "scanner exit status: ${PIPESTATUS[0]} (not the security verdict)"
          set -e
          if [ ! -s zap-report.json ]; then
            echo "::error::the scanner produced no report — the scan did not run, so the app is unverified"
            echo "--- scanner log (last 20) ---"
            tail -20 zap-scan.log
            if [ -f zap.log ]; then
              echo "--- ZAP daemon log (last 40) ---"
              tail -40 zap.log
            else
              echo "no zap.log was written"
            fi
            exit 1
          fi
          echo "alert breakdown:"
          grep -o '"level": *"[A-Z]*"' zap-report.json | sort | uniq -c || echo "no alerts recorded"

      - name: Fail on ERROR-level alerts
        run: |
          if grep -qE '"level"[[:space:]]*:[[:space:]]*"ERROR"' zap-report.json; then
            echo "::error::ZAP reported ERROR-level alerts against the built app"
            grep -o '"alert": *"[^"]*"' zap-report.json | sort -u | head -20
            exit 1
          fi
          echo "no ERROR-level alerts"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            zap-report.json
            zap-scan.log
            zap.log
          retention-days: 7
          if-no-files-found: ignore

  authz:
    name: Authorization (RLS) suite
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      AUTHZ_USER_A_EMAIL: ${{ vars.AUTHZ_USER_A_EMAIL }}
      AUTHZ_USER_A_PASSWORD: ${{ secrets.AUTHZ_USER_A_PASSWORD }}
      AUTHZ_USER_B_EMAIL: ${{ vars.AUTHZ_USER_B_EMAIL }}
      AUTHZ_USER_B_PASSWORD: ${{ secrets.AUTHZ_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The suite is zero-dependency, so there is no npm ci here on purpose.
      - name: Is the suite configured?
        id: config
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            if [ -n "$AUTHZ_USER_A_PASSWORD" ] && [ -n "$AUTHZ_USER_B_PASSWORD" ]; then
              echo "tenant=true" >> "$GITHUB_OUTPUT"
            else
              echo "tenant=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "tenant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Anonymous access must be empty, cross-tenant access must fail
        if: steps.config.outputs.configured == 'true'
        run: npm run test:authz

      - name: Warn that the suite is not protecting anything yet
        if: steps.config.outputs.configured != 'true'
        run: |
          {
            echo "### Authorization suite is NOT running"
            echo ""
            echo "No repository variables are configured, so cross-tenant isolation is currently unverified."
            echo ""
            echo "| Check | What it proves |"
            echo "| --- | --- |"
            echo "| A, B, F | anonymous callers cannot read, insert or execute anything |"
            echo "| C, D, E | one signed-in user cannot read, update or delete another user's rows |"
            echo ""
            echo "To switch it on, add these repository variables and secrets in"
            echo "**Settings -> Secrets and variables -> Actions**:"
            echo ""
            echo '```'
            echo "variables:  SUPABASE_URL  SUPABASE_ANON_KEY"
            echo "            AUTHZ_USER_A_EMAIL  AUTHZ_USER_B_EMAIL"
            echo "secrets:    AUTHZ_USER_A_PASSWORD  AUTHZ_USER_B_PASSWORD"
            echo '```'
            echo ""
            echo "Use two disposable test accounts. The write probe only ever aims at user B."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=authz suite not configured::Checks A/B/F and C/D/E did not run. See the job summary for the repository variables and secrets that switch this on."

  headers:
    name: Production security headers
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Assert hardened headers are still served
        env:
          TARGET: ${{ vars.PRODUCTION_URL || 'https://kaisy-sales.vercel.app' }}
        run: |
          headers=$(curl -sSI "$TARGET/invoices")
          status=0
          for h in content-security-policy strict-transport-security x-frame-options x-content-type-options referrer-policy permissions-policy; do
            if echo "$headers" | grep -qi "^$h:"; then
              echo "ok   $h"
            else
              echo "::error::missing response header: $h"
              status=1
            fi
          done
          exit $status
