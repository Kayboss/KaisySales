<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KaisySales — icon source</title>
  <!--
    The source every raster icon is rendered from. `scripts/make-favicons.mjs`
    sets the viewport to each size and screenshots this page, so the icon is
    drawn once, at whatever size is asked for, rather than resized from one
    master and left blurry at 16px.

    Google Search does not accept an SVG favicon (its list is BMP, GIF, ICO,
    PNG, JPEG, PPM, TIFF), which is why a raster set exists at all.

    `--mark` is the share of the canvas the mark takes. It is set by the
    renderer: a small icon needs a bigger mark to stay legible in a tab.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 100vw; height: 100vh; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6F240A;
      overflow: hidden;
    }

    img {
      display: block;
      width: calc(var(--mark, 0.76) * 100%);
      height: auto;
    }
  </style>
</head>
<body>
  <img src="/public/logo.svg" alt="" />
</body>
</html>
