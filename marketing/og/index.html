<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KaisySales — Open Graph image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tango+Sans:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 1200px; height: 630px; }

    body {
      background: #6F240A;
      color: #FCF9F3;
      font-family: 'Work Sans', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    .glow {
      position: absolute;
      right: -140px;
      bottom: -190px;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.34), rgba(212, 175, 55, 0) 70%);
    }

    .frame {
      position: relative;
      height: 100%;
      padding: 62px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 16px; }

    .brand img { height: 54px; width: auto; display: block; }

    .brand span {
      font-family: 'Tango Sans', sans-serif;
      font-size: 40px;
      font-weight: 700;
      color: #ffffff;
    }

    .eyebrow {
      font-size: 20px;
      font-weight: 600;
      color: #D4AF37;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Tango Sans', sans-serif;
      font-size: 52px;
      line-height: 1.14;
      font-weight: 700;
      color: #FCF9F3;
      max-width: 940px;
    }

    h1 em { font-style: normal; color: #D4AF37; }

    .sub {
      margin-top: 18px;
      font-size: 21px;
      line-height: 1.45;
      color: #EADFD6;
      max-width: 840px;
    }

    .rule {
      height: 2px;
      width: 180px;
      margin-top: 22px;
      background: linear-gradient(90deg, #D4AF37, rgba(212, 175, 55, 0));
    }

    .foot { display: flex; align-items: center; justify-content: space-between; }

    .chips { display: flex; gap: 10px; }

    .chip {
      border: 1px solid rgba(252, 249, 243, 0.35);
      border-radius: 999px;
      padding: 7px 15px;
      font-size: 16px;
      font-weight: 600;
      color: #FCF9F3;
    }

    .url { font-size: 18px; font-weight: 600; color: #D4AF37; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame">
    <div class="brand">
      <img src="/public/logo.svg" alt="" />
      <span>KaisySales</span>
    </div>

    <div>
      <div class="eyebrow">For entrepreneurs across Africa</div>
      <h1>Sales, inventory and invoicing<br />in <em>one place</em></h1>
      <p class="sub">Track every sale and expense, manage stock, send professional invoices and see your real profit — free to start.</p>
      <div class="rule"></div>
    </div>

    <div class="foot">
      <div class="chips">
        <span class="chip">GHS</span>
        <span class="chip">NGN</span>
        <span class="chip">KES</span>
        <span class="chip">ZAR</span>
      </div>
      <span class="url">www.kaisysales.com</span>
    </div>
  </div>
</body>
</html>
